[project]
name = "undercover"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.108",
    "claude-agent-sdk>=0.2.161",
    "deepagents>=0.7.19",
    "fastapi>=0.141.1",
    "gradio>=6.29.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "langfuse>=4.16.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mangum>=0.22.0",
    "nbformat>=5.11.1",
    "ollama>=0.6.2",
    "openai>=3.19.2",
    "openrouter>=1.2.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.3",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
server = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mangum>=0.22.0",
    "openrouter>=1.2.1",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[tool.ruff]
include = ["backend/**/*.py", "agent/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "PL", "S", "PT", "FAST", "C90", "PLR1702"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["backend", "agent"]
pythonpath = ["."]
addopts = "--import-mode=importlib --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["backend", "agent"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80

[tool.pyright]
include = ["backend", "agent"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
